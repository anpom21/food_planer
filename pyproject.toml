[project]
name = "food-planer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Andreas Pommerencke", email = "anpom21@student.sdu.dk" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "python-multipart>=0.0.18",
    "openai>=3.16.2",
    "python-dotenv>=1.2.3",
    "httpx>=0.28",
]

[project.scripts]
food-planer = "food_planer:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
